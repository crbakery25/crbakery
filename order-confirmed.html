  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body class="confirm-page">

  <footer class="site-footer">
    <div class="wrap">

        <div>
          <p class="wordmark">CR Bakery</p>

  <script>
    /* Script version: bump this number (in all five pages) whenever a js file changes, so visitors pick up the new file on their next visit. */
    (function () {
      var v = 9;
      ["site-config", "menu-data", "site"].forEach(function (n) {
        document.write('<script src="js/' + n + '.js?v=' + v + '"><\/script>');
      });
    })();
